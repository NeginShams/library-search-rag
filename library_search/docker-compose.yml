services:
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.30.5   # official registry
    # or keep semitechnologies/weaviate:1.30.5 (still works)
    container_name: weaviate
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: "node1"
      # Optional but useful:
      # LOG_LEVEL: "info"
      # ASYNC_INDEXING: "true"          # better for large imports
    volumes:
      - weaviate_data:/var/lib/weaviate
    # Optional healthcheck
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/.well-known/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  weaviate_data: